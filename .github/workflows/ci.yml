name: CI

# Safety net after a push. The release workflow repeats the tests before building,
# so documentation-only changes do not run CI.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE"]
  workflow_dispatch:

permissions:
  contents: read

# A newer push cancels an unfinished older run; only the latest state matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  walklevel:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node.js 24 (TypeScript scripts run without a build step)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Rust stable (Rust 2024) and clippy
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - name: Core and Tauri layer (clippy, tests)
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          if ($LASTEXITCODE) { throw "clippy" }
          cargo test --workspace --locked
          if ($LASTEXITCODE) { throw "cargo test" }
      - name: Interface (types, build, view test in Edge)
        run: |
          npm ci
          if ($LASTEXITCODE) { throw "npm ci" }
          npm run check
          if ($LASTEXITCODE) { throw "npm run check" }
          npm run build
          if ($LASTEXITCODE) { throw "npm run build" }
          npm run test:ui -- --no-screenshots
          if ($LASTEXITCODE) { throw "test:ui" }
