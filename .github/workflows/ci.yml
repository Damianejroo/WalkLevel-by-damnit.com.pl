name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen  # testy okna bez ekranu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9" # ta sama wersja, którą Uruchom.bat pobiera testerowi
      - name: Zależności (zgodne z uv.lock)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check
      - name: Formatowanie
        run: uv run ruff format --check
      - name: Typy
        run: uv run mypy
      - name: Testy
        run: uv run pytest -q
