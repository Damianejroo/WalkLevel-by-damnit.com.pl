name: Release

# New version:  git tag -a v0.6.4 -m "What changed"  &&  git push origin v0.6.4
#
# Since 0.6.0 WalkLevel is built with Tauri 2 + Svelte + Rust. Tests and the build run in
# parallel. The build creates the release as a DRAFT (invisible to the Update button); publishing
# turns it into a visible release only when the tests have passed too.
# Installer: packaging/build.ps1 (the same script as locally), file WalkLevel-Setup-X.Y.Z.exe,
# signed with the owner's key (secrets WALKLEVEL_SIGNING_KEY and WALKLEVEL_SIGNING_KEY_PASSWORD,
# docs/release-signing.md). WalkLevel 0.6.4 and newer install only a correctly signed installer.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: wydanie
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_name }}
  CARGO_TERM_COLOR: never
  # Needed for 0.6.4 only: WalkLevel 0.6.3 and older look only for Bieznia-Setup-X.Y.Z.exe, so
  # the release also carries the same installer (with .sha256 and .sig) under that name.
  # From 0.6.5 set this to "false"; later delete it with the step "Copy under the old name".
  LEGACY_INSTALLER_COPY: "true"

jobs:
  testy:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node.js 24 (TypeScript scripts run without a build step)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Rust stable (Rust 2024) and clippy
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustc --version
      - name: Core and Tauri layer (clippy, tests)
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          if ($LASTEXITCODE) { throw "clippy" }
          cargo test --workspace --locked
          if ($LASTEXITCODE) { throw "cargo test" }
      - name: Interface (types, build, view test in Edge)
        run: |
          npm ci
          if ($LASTEXITCODE) { throw "npm ci" }
          npm run check
          if ($LASTEXITCODE) { throw "npm run check" }
          npm run build
          if ($LASTEXITCODE) { throw "npm run build" }
          npm run test:ui -- --no-screenshots
          if ($LASTEXITCODE) { throw "test:ui" }
          node tests-ui/settings-collapse.ts
          if ($LASTEXITCODE) { throw "settings-collapse" }

  budowa:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write # release draft
      id-token: write # build provenance (Sigstore)
      attestations: write
    env:
      INNO_URL: https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe
      INNO_SHA256: 8a5a6711c3766a6e5fb74f280ba0e3551e719ce94538d901fdbd1f8f9920b3f0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # tag message = release notes
      - name: Version from the tag
        shell: pwsh
        run: |
          if ($env:TAG -notmatch '^v(\d+\.\d+\.\d+)$') { throw "The tag must look like v1.2.3" }
          "VERSION=$($Matches[1])" >> $env:GITHUB_ENV
      - name: Signing keys are set (docs/release-signing.md)
        shell: pwsh
        env:
          SIGNING_KEY: ${{ secrets.WALKLEVEL_SIGNING_KEY }}
          SIGNING_KEY_PASSWORD: ${{ secrets.WALKLEVEL_SIGNING_KEY_PASSWORD }}
        run: |
          $missing = @()
          if (-not $env:SIGNING_KEY) { $missing += 'WALKLEVEL_SIGNING_KEY' }
          if (-not $env:SIGNING_KEY_PASSWORD) { $missing += 'WALKLEVEL_SIGNING_KEY_PASSWORD' }
          if ($missing) {
            "::error::Missing Actions secret: $($missing -join ', '). The release stops here, because WalkLevel 0.6.4 and newer refuse an unsigned installer. See docs/release-signing.md."
            exit 1
          }
          if (Select-String -Path crates/core/src/updates.rs -Pattern 'PLACEHOLDER: paste' -SimpleMatch -Quiet) {
            "::error::SIGNING_PUBLIC_KEY in crates/core/src/updates.rs is still the placeholder. Paste the public key first, see docs/release-signing.md."
            exit 1
          }
      - name: Node.js 24 (TypeScript scripts run without a build step)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Rust stable and Inno Setup (pinned version, checked hash)
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          $ProgressPreference = 'SilentlyContinue'
          $f = "$env:RUNNER_TEMP\innosetup.exe"
          Invoke-WebRequest -Uri $env:INNO_URL -OutFile $f -UseBasicParsing
          if ((Get-FileHash $f -Algorithm SHA256).Hash.ToLower() -ne $env:INNO_SHA256) { throw "Wrong Inno Setup hash" }
          $dir = "$env:RUNNER_TEMP\inno"
          Start-Process -FilePath $f -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER','/PORTABLE=1',"/DIR=$dir" -Wait
          "ISCC=$dir\ISCC.exe" >> $env:GITHUB_ENV
      - name: Interface dependencies
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE) { throw "npm ci" }
      - name: Build the exe and the installer
        shell: pwsh
        run: ./packaging/build.ps1 -Version $env:VERSION -Iscc $env:ISCC
      - name: Sign the installer (minisign, tauri signer)
        shell: pwsh
        env:
          SIGNING_KEY: ${{ secrets.WALKLEVEL_SIGNING_KEY }}
          SIGNING_KEY_PASSWORD: ${{ secrets.WALKLEVEL_SIGNING_KEY_PASSWORD }}
        run: |
          # a secret pasted or piped with a line break at the end would not decode
          $env:TAURI_SIGNING_PRIVATE_KEY = $env:SIGNING_KEY.Trim()
          $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD = $env:SIGNING_KEY_PASSWORD.TrimEnd("`r", "`n")
          npx tauri signer sign --app-version $env:VERSION "dist-installer/WalkLevel-Setup-$env:VERSION.exe"
          if ($LASTEXITCODE) { throw "tauri signer sign (check both secrets, docs/release-signing.md)" }
      - name: Check the signature with the key built into the app
        shell: pwsh
        env:
          WALKLEVEL_SIGNED_INSTALLER: ${{ github.workspace }}/dist-installer/WalkLevel-Setup-${{ env.VERSION }}.exe
          WALKLEVEL_SIGNED_VERSION: ${{ env.VERSION }}
        run: |
          cargo test -p walklevel-core --lib --locked updates::tests::release_installer_is_signed_with_built_in_key -- --ignored --exact
          if ($LASTEXITCODE) { throw "The signature does not match SIGNING_PUBLIC_KEY: the secret and the public key in updates.rs are not one pair (docs/release-signing.md)" }
      - name: Copy under the old name for WalkLevel 0.6.3 (LEGACY_INSTALLER_COPY)
        if: env.LEGACY_INSTALLER_COPY == 'true'
        shell: pwsh
        run: |
          $dist = "dist-installer"
          $new = "WalkLevel-Setup-$env:VERSION.exe"
          $old = "Bieznia-Setup-$env:VERSION.exe"
          Copy-Item "$dist/$new" "$dist/$old"
          Copy-Item "$dist/$new.sig" "$dist/$old.sig"
          $hash = (Get-FileHash "$dist/$old" -Algorithm SHA256).Hash.ToLower()
          "$hash  $old" | Out-File -Encoding ascii "$dist/$old.sha256"
      - name: Build provenance of the installer
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist-installer/*-Setup-*.exe
      - name: Release draft (not visible to the app yet)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = git tag -l --format='%(contents)' $env:TAG
          if (-not $notes) { $notes = "New version of WalkLevel.`n`nNowa wersja WalkLevel." }
          $notes += "`n`n**Installation:** download WalkLevel-Setup-$env:VERSION.exe and run it. Already have the app? Click Aktualizuj (Update) in it. The app checks the signature (.sig) before it installs an update."
          $notes += "`n`n**Instalacja:** pobierz WalkLevel-Setup-$env:VERSION.exe i uruchom. Masz już aplikację? Kliknij w niej Aktualizuj. Aplikacja sprawdza podpis (.sig), zanim zainstaluje aktualizację."
          $names = @("WalkLevel-Setup-$env:VERSION.exe")
          if ($env:LEGACY_INSTALLER_COPY -eq 'true') {
            $names += "Bieznia-Setup-$env:VERSION.exe"
            $notes += "`n`nBieznia-Setup-$env:VERSION.exe is the same installer under its old name, for the Update button of WalkLevel 0.6.3."
            $notes += "`n`nBieznia-Setup-$env:VERSION.exe to ten sam instalator pod starą nazwą, dla przycisku Aktualizuj w WalkLevel 0.6.3."
          }
          $notes | Out-File -Encoding utf8 notes.md
          $dist = "dist-installer"
          $files = foreach ($name in $names) { "$dist/$name"; "$dist/$name.sha256"; "$dist/$name.sig" }
          gh release create $env:TAG @files --draft --title "WalkLevel $env:VERSION" --notes-file notes.md --verify-tag

  publikacja:
    needs: [testy, budowa]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish the release (tests and build passed)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh release edit "$TAG" --repo "$REPO" --draft=false --latest
