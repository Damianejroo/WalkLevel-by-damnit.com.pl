name: Release

# Nowa wersja:  git tag -a v0.6.1 -m "Co się zmieniło"  &&  git push origin v0.6.1
#
# Od 0.6.0 budujemy WalkLevel w Tauri 2 + Svelte + Rust. Testy i budowa idą równolegle.
# Budowa tworzy wydanie jako SZKIC (niewidoczny dla przycisku Aktualizuj);
# publikacja zmienia go w widoczne wydanie dopiero, gdy testy też przeszły.
# Instalator: packaging/build.ps1 (ten sam skrypt co lokalnie), nazwa pliku
# Bieznia-Setup-X.Y.Z.exe jak w 0.5.x - aktualizacja z 0.5.x podmienia aplikację.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: wydanie
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_name }}
  CARGO_TERM_COLOR: never

jobs:
  testy:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node.js 24 (skrypty .ts bez kompilacji)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Rust stable (Rust 2024) i clippy
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustc --version
      - name: Rdzeń i klej Tauri (clippy, testy)
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          if ($LASTEXITCODE) { throw "clippy" }
          cargo test --workspace --locked
          if ($LASTEXITCODE) { throw "cargo test" }
      - name: Interfejs (typy, budowa, test widoków w Edge)
        run: |
          npm ci
          if ($LASTEXITCODE) { throw "npm ci" }
          npm run check
          if ($LASTEXITCODE) { throw "npm run check" }
          npm run build
          if ($LASTEXITCODE) { throw "npm run build" }
          npm run test:ui -- --no-screenshots
          if ($LASTEXITCODE) { throw "test:ui" }
          node tests-ui/settings-collapse.ts
          if ($LASTEXITCODE) { throw "settings-collapse" }

  budowa:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write # szkic wydania
      id-token: write # poświadczenie pochodzenia (Sigstore)
      attestations: write
    env:
      INNO_URL: https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe
      INNO_SHA256: 8a5a6711c3766a6e5fb74f280ba0e3551e719ce94538d901fdbd1f8f9920b3f0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # treść tagu = opis wydania
      - name: Node.js 24 (skrypty .ts bez kompilacji)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Wersja z tagu
        shell: pwsh
        run: |
          if ($env:TAG -notmatch '^v(\d+\.\d+\.\d+)$') { throw "Tag musi mieć postać v1.2.3" }
          "VERSION=$($Matches[1])" >> $env:GITHUB_ENV
      - name: Rust stable i Inno Setup (przypięta wersja, sprawdzona suma)
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          $ProgressPreference = 'SilentlyContinue'
          $f = "$env:RUNNER_TEMP\innosetup.exe"
          Invoke-WebRequest -Uri $env:INNO_URL -OutFile $f -UseBasicParsing
          if ((Get-FileHash $f -Algorithm SHA256).Hash.ToLower() -ne $env:INNO_SHA256) { throw "Zła suma Inno Setup" }
          $dir = "$env:RUNNER_TEMP\inno"
          Start-Process -FilePath $f -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER','/PORTABLE=1',"/DIR=$dir" -Wait
          "ISCC=$dir\ISCC.exe" >> $env:GITHUB_ENV
      - name: Zależności interfejsu
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE) { throw "npm ci" }
      - name: Budowa exe i instalatora
        shell: pwsh
        run: ./packaging/build.ps1 -Version $env:VERSION -Iscc $env:ISCC
      - name: Poświadczenie pochodzenia instalatora
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist-installer/Bieznia-Setup-*.exe
      - name: Szkic wydania (jeszcze niewidoczny dla aplikacji)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = git tag -l --format='%(contents)' $env:TAG
          if (-not $notes) { $notes = "New version of WalkLevel.`n`nNowa wersja WalkLevel." }
          $notes += "`n`n**Installation:** download Bieznia-Setup-$env:VERSION.exe and run it. Already have the app? Click Aktualizuj (Update) in it."
          $notes += "`n`n**Instalacja:** pobierz Bieznia-Setup-$env:VERSION.exe i uruchom. Masz już aplikację? Kliknij w niej Aktualizuj."
          $notes | Out-File -Encoding utf8 notes.md
          $dist = "dist-installer"
          gh release create $env:TAG "$dist/Bieznia-Setup-$env:VERSION.exe" "$dist/Bieznia-Setup-$env:VERSION.exe.sha256" --draft --title "WalkLevel $env:VERSION" --notes-file notes.md --verify-tag

  publikacja:
    needs: [testy, budowa]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Opublikuj wydanie (testy i budowa przeszły)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh release edit "$TAG" --repo "$REPO" --draft=false --latest
