name: Wydanie

# Nowa wersja dla testera:  git tag -a v0.2.1 -m "Co się zmieniło"  &&  git push origin v0.2.1
# Testy -> Bieznia.exe (PyInstaller) -> instalator (Inno Setup) -> poświadczenie -> GitHub Release.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: wydanie
  cancel-in-progress: false

jobs:
  wydanie:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write # utworzenie wydania
      id-token: write # poświadczenie pochodzenia (Sigstore)
      attestations: write
    env:
      QT_QPA_PLATFORM: offscreen
      TAG: ${{ github.ref_name }}
      INNO_URL: https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe
      INNO_SHA256: 8a5a6711c3766a6e5fb74f280ba0e3551e719ce94538d901fdbd1f8f9920b3f0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # potrzebne do treści tagu (opis wydania)
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
      - name: Wersja z tagu
        shell: pwsh
        run: |
          if ($env:TAG -notmatch '^v(\d+\.\d+\.\d+)$') { throw "Tag musi mieć postać v1.2.3" }
          "VERSION=$($Matches[1])" >> $env:GITHUB_ENV
      - name: Zależności (zgodne z uv.lock)
        run: uv sync --locked
      - name: Testy i kontrole
        run: |
          uv run ruff check
          uv run ruff format --check
          uv run mypy
          uv run pytest -q
      - name: Inno Setup (przypięta wersja, sprawdzona suma)
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $f = "$env:RUNNER_TEMP\innosetup.exe"
          Invoke-WebRequest -Uri $env:INNO_URL -OutFile $f -UseBasicParsing
          if ((Get-FileHash $f -Algorithm SHA256).Hash.ToLower() -ne $env:INNO_SHA256) { throw "Zła suma Inno Setup" }
          $dir = "$env:RUNNER_TEMP\inno"
          Start-Process -FilePath $f -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER','/PORTABLE=1',"/DIR=$dir" -Wait
          "ISCC=$dir\ISCC.exe" >> $env:GITHUB_ENV
      - name: Budowa exe i instalatora
        run: uv run python packaging/zbuduj.py ${{ env.VERSION }}
      - name: Poświadczenie pochodzenia instalatora
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/Bieznia-Setup-*.exe
      - name: Wydanie na GitHubie
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = git tag -l --format='%(contents)' $env:TAG
          if (-not $notes) { $notes = "Nowa wersja Bieżni." }
          $notes += "`n`n**Instalacja:** pobierz Bieznia-Setup-$env:VERSION.exe i uruchom. Masz już aplikację? Kliknij w niej Aktualizuj."
          $notes | Out-File -Encoding utf8 notes.md
          gh release create $env:TAG dist/Bieznia-Setup-$env:VERSION.exe dist/Bieznia-Setup-$env:VERSION.exe.sha256 --title "Bieżnia $env:VERSION" --notes-file notes.md --verify-tag
