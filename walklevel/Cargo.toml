[workspace]
resolver = "2"
members = ["src-tauri", "crates/core"]

[workspace.package]
version = "0.6.1"
edition = "2024"
rust-version = "1.90"
authors = ["damnit.com.pl Damian Skrzypiec"]

[profile.release]
# mały i szybki exe: optymalizacja rozmiaru, bez symboli, LTO
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
