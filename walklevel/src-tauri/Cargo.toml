[package]
name = "walklevel"
description = "WalkLevel - chodzisz w realu, idziesz w grze"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[lib]
name = "walklevel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
walklevel-core = { path = "../crates/core" }
tauri = { version = "2.12.7", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
chrono = "0.4.45"
toml = "1.2.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_Media_Audio", "Win32_System_Registry"] }
