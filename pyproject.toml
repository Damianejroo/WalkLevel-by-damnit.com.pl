[project]
name = "bieznia"
version = "0.1.0"
description = "Most: bieżnia WalkingPad X21 -> klawiatura / pad w grach na Windows"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
# bleak: Bluetooth LE (na Windows przez WinRT), sv-ttk: wygląd okna w stylu Windows 11.
dependencies = [
    "bleak>=3.1,<4",
    "pyside6-essentials>=6.12,<7",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=8",
    "ruff>=0.8",
]

[tool.uv]
# Aplikacja, nie biblioteka: nic nie jest budowane ani instalowane, kod działa wprost
# z folderu repo (python -m bieznia). Mniej kroków u testera i brak pobierania
# narzędzi do budowania z PyPI.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# RUF001-003 zostają włączone: pilnują zasady "tylko dywiz" (bez półpauz) w tekstach.

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF012"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["bieznia"]
