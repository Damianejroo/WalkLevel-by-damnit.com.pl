[project]
name = "bieznia"
version = "0.2.0"
description = "Bieżnia WalkingPad X21 jako sterowanie w grach na Windows"
authors = [{ name = "damnit.com.pl Damian Skrzypiec", email = "kontakt@damnit.com.pl" }]
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
# bleak: Bluetooth LE (na Windows przez WinRT), PySide6: okno aplikacji.
dependencies = [
    "bleak>=3.1,<4",
    "pyside6-essentials>=6.12,<7",
]

[project.urls]
Homepage = "https://damnit.com.pl"
Repository = "https://github.com/Damianejroo/WalkLevel-by-damnit.com.pl"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pyinstaller>=6",
    "pytest>=8",
    "ruff>=0.8",
]

[tool.uv]
# Aplikacja, nie biblioteka: nic nie jest budowane ani instalowane, kod działa wprost
# z folderu repo (python -m bieznia). Mniej kroków u testera i brak pobierania
# narzędzi do budowania z PyPI.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# RUF001-003 zostają włączone: pilnują zasady "tylko dywiz" (bez półpauz) w tekstach.

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF012"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["bieznia"]

[[tool.mypy.overrides]]
# Ekrany to mixiny klasy App (self: App) - mypy zgłasza to jako "misc", ale sprawdza treść.
module = "bieznia.gui.ekrany.*"
disable_error_code = ["misc"]
