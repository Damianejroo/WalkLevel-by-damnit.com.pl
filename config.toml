# Domyślne ustawienia mostu. NIE edytuj tego pliku u siebie –
# żeby coś zmienić lokalnie, utwórz obok plik config.local.toml
# z tymi sekcjami/kluczami, które chcesz nadpisać (nie trafia do gita).

[source]
# sim    – symulowana bieżnia (F6 wolniej, F7 szybciej)
# replay – odtwarzanie nagrania z pliku .jsonl
type = "sim"
replay_file = ""

[output]
# dry  – tylko pokazuje, co by zrobił (bezpieczne, nic nie naciska)
# keys – naciska W i Shift w aktywnym oknie (np. w grze)
type = "dry"
# Most startuje WYŁĄCZONY, włączasz go klawiszem toggle (F8).
start_enabled = false

[mapping]
# km/h – poniżej: stoisz, nic nie jest wciśnięte
stand_below = 0.8
# bieg (Shift+W) włącza się od run_on, wyłącza poniżej run_off (histereza)
run_on = 6.3
run_off = 5.7
# prędkość, przy której gałka pada jest wychylona na 100%
max_speed = 10.0
# średnia z ostatnich N odczytów
smoothing_samples = 3
# brak odczytu dłużej niż tyle sekund = stoisz (bezpiecznik)
stale_after_s = 2.0

[hotkeys]
toggle = "F8"
sim_slower = "F6"
sim_faster = "F7"

[record]
# zapisuje odczyty z bieżni do folderu nagrania/ (do odtwarzania u siebie)
enabled = false

[update]
# skąd przycisk Aktualizuj pobiera nową wersję
remote = "origin"
branch = "main"

[ble]
# Zapamiętana bieżnia (ustawia się sama po pierwszym połączeniu w oknie).
device_address = ""
device_name = ""

[ui]
simulator = false
record = false
always_on_top = false
# system | light | dark
theme = "system"
large_text = false
# szczegółowe logi Bluetooth (surowa rozmowa z bieżnią) - do zdalnej diagnozy
detailed_logs = true

[zgloszenia]
# Adres HTTPS, na który przycisk Wyślij zgłoszenie wysyła paczkę z logami (POST, multipart).
# Pusty = paczka trafia do e-maila na adres kontaktowy autora.
adres = ""
